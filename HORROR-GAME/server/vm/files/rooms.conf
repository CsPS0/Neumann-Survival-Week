# Settings for the Empty School server VM. Edit this file, then run: sudo systemctl restart neumann-rooms
# Number of rooms. Each room is one game server on its own UDP port. Players in the same room play together.
ROOMS=4
# Port of the first room. Room 2 uses the next port, and so on.
FIRST_PORT=7777
# Maximum players in each room.
MAX_PLAYERS=10
