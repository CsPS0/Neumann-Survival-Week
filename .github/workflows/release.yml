name: Release HORROR-GAME

# Runs only when a release tag is pushed. Branch pushes and pull requests never start it.
# Use a tag without spaces, for example: demo-1.0, demo1.0 or v1.0.
on:
  push:
    tags:
      - "demo*"
      - "v*"

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7"
  GODOT_CHANNEL: "stable"
  PROJECT_DIR: HORROR-GAME

jobs:
  desktop:
    name: Desktop builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}"
          unzip -q templates.tpz -d templates
          mv templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}/"

      - name: Prepare the project
        run: |
          cp .github/godot/export_presets.ci.cfg "$PROJECT_DIR/export_presets.cfg"
          mkdir -p "$PROJECT_DIR/build/linux" "$PROJECT_DIR/build/windows" "$PROJECT_DIR/build/vr"
          godot --headless --path "$PROJECT_DIR" --import

      - name: Export Linux
        run: godot --headless --path "$PROJECT_DIR" --export-release "Linux/X11" build/linux/TheEmptySchool.x86_64

      - name: Export Windows
        run: godot --headless --path "$PROJECT_DIR" --export-release "Windows Desktop" build/windows/TheEmptySchool.exe

      - name: Export Windows VR
        run: godot --headless --path "$PROJECT_DIR" --export-release "Windows VR" build/vr/TheEmptySchool_VR.exe

      - name: Package
        run: |
          mkdir -p dist
          tag="${GITHUB_REF_NAME}"
          (cd "$PROJECT_DIR/build/linux" && zip -q -r "$GITHUB_WORKSPACE/dist/TheEmptySchool-${tag}-linux.zip" .)
          (cd "$PROJECT_DIR/build/windows" && zip -q -r "$GITHUB_WORKSPACE/dist/TheEmptySchool-${tag}-windows.zip" .)
          (cd "$PROJECT_DIR/build/vr" && zip -q -r "$GITHUB_WORKSPACE/dist/TheEmptySchool-${tag}-windows-vr.zip" .)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: dist/*.zip
          if-no-files-found: error

  android:
    name: Android and Quest builds
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
      GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Check signing secrets
        id: secrets
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$GODOT_ANDROID_KEYSTORE_RELEASE_USER" ] && [ -n "$GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android signing secrets are missing. Android and Quest builds are skipped."
          fi

      - name: Check out the tagged commit
        if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@v4

      - name: Set up Java
        if: steps.secrets.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        if: steps.secrets.outputs.present == 'true'
        run: |
          sdk="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmake;3.10.2.4988893" "ndk;28.1.13356709"
          echo "ANDROID_SDK=$sdk" >> "$GITHUB_ENV"

      - name: Install Godot and export templates
        if: steps.secrets.outputs.present == 'true'
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}"
          unzip -q templates.tpz -d templates
          mv templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}/"

      - name: Configure Godot for Android
        if: steps.secrets.outputs.present == 'true'
        run: |
          mkdir -p "$HOME/.config/godot"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          keytool -genkey -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" > /dev/null
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_SDK"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Prepare the project
        if: steps.secrets.outputs.present == 'true'
        run: |
          cp .github/godot/export_presets.ci.cfg "$PROJECT_DIR/export_presets.cfg"
          mkdir -p "$PROJECT_DIR/build/mobile" "$PROJECT_DIR/build/vr"
          godot --headless --path "$PROJECT_DIR" --import

      - name: Export Android
        if: steps.secrets.outputs.present == 'true'
        run: godot --headless --path "$PROJECT_DIR" --export-release "Android" build/mobile/TheEmptySchool.apk

      - name: Export Quest
        if: steps.secrets.outputs.present == 'true'
        run: godot --headless --path "$PROJECT_DIR" --export-release "Android VR (Quest)" build/vr/TheEmptySchool_Quest.apk

      - name: Collect APKs
        if: steps.secrets.outputs.present == 'true'
        run: |
          mkdir -p dist
          cp "$PROJECT_DIR/build/mobile/TheEmptySchool.apk" "dist/TheEmptySchool-${GITHUB_REF_NAME}-android.apk"
          cp "$PROJECT_DIR/build/vr/TheEmptySchool_Quest.apk" "dist/TheEmptySchool-${GITHUB_REF_NAME}-quest.apk"

      - name: Upload artifacts
        if: steps.secrets.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [desktop, android]
    if: ${{ !cancelled() && needs.desktop.result == 'success' && needs.android.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: The Empty School ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'demo') }}
